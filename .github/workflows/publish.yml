name: Publish NuGet

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "The tagged commit is not on master."
            exit 1
          }

          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ValidateDocBr.sln

      - name: Test
        run: dotnet test ValidateDocBr.sln --configuration Release --framework net10.0 --no-restore

      - name: Pack
        run: >-
          dotnet pack ValidateDocBr/ValidateDocBr.csproj
          --configuration Release
          --no-restore
          -p:PackageVersion=${{ env.PACKAGE_VERSION }}
          --output artifacts

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: lucasaraujo1301

      - name: Publish
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
